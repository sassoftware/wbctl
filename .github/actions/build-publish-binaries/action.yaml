name: Build and publish binaries
description: Build, sign, and notarize binaries on macOS, then upload test artifacts or publish release assets. Requires id-token write and contents write permissions.
inputs:
  signing-mode:
    description: Signing mode (auto, keyless, or unsigned).
    default: auto
  macos-certificate-p12:
    description: Base64-encoded Developer ID Application PKCS#12 certificate.
  macos-certificate-password:
    description: Password for the Apple certificate.
  macos-sign-identity:
    description: Developer ID Application signing identity.
  windows-certificate-p12:
    description: Base64-encoded Windows code-signing PKCS#12 certificate.
  windows-sign-password:
    description: Password for the Windows certificate.
  apple-id:
    description: Apple developer account email for notarization.
  apple-app-specific-password:
    description: App-specific password for the Apple account.
  apple-team-id:
    description: Apple Developer team ID.
  release-tag:
    description: Existing release tag to publish on push events.
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Install Cosign
      if: inputs.signing-mode != 'unsigned'
      uses: sigstore/cosign-installer@v3.10.0
      with:
        cosign-release: v3.0.2

    - name: Install Windows signing tool
      if: inputs.signing-mode == 'auto'
      env:
        WINDOWS_CERTIFICATE_P12: ${{ inputs.windows-certificate-p12 }}
      shell: bash
      run: |
        if [[ -n "$WINDOWS_CERTIFICATE_P12" ]] && ! command -v osslsigncode >/dev/null; then
          brew install osslsigncode
        fi

    - name: Build and sign binaries
      shell: bash
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
        MACOS_SIGN_IDENTITY: ${{ inputs.macos-sign-identity }}
        MACOS_CERTIFICATE_P12: ${{ inputs.macos-certificate-p12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos-certificate-password }}
        WINDOWS_CERTIFICATE_P12: ${{ inputs.windows-certificate-p12 }}
        WINDOWS_SIGN_PASSWORD: ${{ inputs.windows-sign-password }}
      run: make -f Makefile-ci.mk build-sign-binaries

    - name: Notarize native-signed macOS binary
      if: inputs.signing-mode == 'auto' && inputs.macos-sign-identity != ''
      shell: bash
      env:
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple-app-specific-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: make -f Makefile-ci.mk notarize-macos

    - name: Upload release artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: wbctl-release-binaries
        path: build/release/*
        if-no-files-found: error

    - name: Publish release assets
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        SIGNING_MODE: ${{ inputs.signing-mode }}
      shell: bash
      run: |
        : "${RELEASE_TAG:?Set release-tag when publishing release assets}"
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        fi
        gh release upload "$RELEASE_TAG" build/release/wbctl-linux-amd64 \
          build/release/wbctl-darwin-universal build/release/wbctl-windows-amd64.exe \
          build/release/checksums.txt scripts/install.sh scripts/install.ps1 --clobber
        if [[ "$SIGNING_MODE" != unsigned ]]; then
          gh release upload "$RELEASE_TAG" build/release/*.sigstore.json --clobber
        fi
