---
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the binaries'
        required: true
        default: ''

jobs:
  release:
    name: Tag a merged release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Tag release
        if: github.event_name != 'workflow_dispatch'
        run: make -f Makefile-ci.mk release-tag
